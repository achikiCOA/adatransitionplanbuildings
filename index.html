<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADA Building Facility Inventory</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212f;
      --muted: #5f6b7a;
      --line: #d8dee8;
      --panel: #ffffff;
      --wash: #f5f7fa;
      --brand: #126b68;
      --brand-strong: #0b514f;
      --accent: #b94c2d;
      --focus: #2855a7;
      --good: #166534;
      --warn: #a16207;
      --bad: #b42318;
      --shadow: 0 12px 32px rgba(23, 33, 47, 0.12);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--wash);
      color: var(--ink);
      line-height: 1.45;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(40, 85, 167, 0.35);
      outline-offset: 2px;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(23, 33, 47, 0.04);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: space-between;
    }

    .brand {
      min-width: 230px;
    }

    .brand h1 {
      font-size: 1.1rem;
      margin: 0;
      letter-spacing: 0;
    }

    .brand p {
      color: var(--muted);
      font-size: 0.86rem;
      margin: 1px 0 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      min-height: 40px;
      padding: 0 13px;
      border-radius: 6px;
      background: #e9edf3;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 650;
      white-space: nowrap;
    }

    .btn.primary {
      background: var(--brand);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--brand-strong);
    }

    .btn.danger {
      background: #f8d7d2;
      color: var(--bad);
    }

    .btn.icon {
      width: 40px;
      padding: 0;
      justify-content: center;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .layout {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      min-height: calc(100vh - 69px);
    }

    .sidebar {
      background: #eef2f5;
      border-right: 1px solid var(--line);
      padding: 18px;
      overflow: auto;
      max-height: calc(100vh - 69px);
      position: sticky;
      top: 69px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 12px;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid #b9c2cf;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      min-height: 40px;
      padding: 8px 10px;
    }

    .textarea {
      resize: vertical;
      min-height: 82px;
    }

    .building-list {
      display: grid;
      gap: 8px;
    }

    .building-card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 11px;
      display: grid;
      gap: 7px;
      text-align: left;
      color: inherit;
      width: 100%;
      min-height: 92px;
    }

    .building-card.active {
      border-color: var(--brand);
      box-shadow: inset 4px 0 0 var(--brand);
    }

    .building-name {
      font-weight: 750;
      font-size: 0.96rem;
    }

    .meta-line {
      color: var(--muted);
      font-size: 0.84rem;
    }

    .pill-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      border-radius: 999px;
      padding: 3px 8px;
      background: #edf0f5;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--muted);
    }

    .pill.good {
      background: #dcfce7;
      color: var(--good);
    }

    .pill.warn {
      background: #fef3c7;
      color: var(--warn);
    }

    .pill.bad {
      background: #fee2e2;
      color: var(--bad);
    }

    main {
      padding: 20px;
      overflow: hidden;
    }

    .empty-state,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(23, 33, 47, 0.04);
    }

    .empty-state {
      min-height: 420px;
      display: grid;
      place-items: center;
      padding: 36px;
      text-align: center;
    }

    .empty-state h2 {
      margin: 0 0 8px;
      font-size: 1.45rem;
    }

    .empty-state p {
      margin: 0 auto 18px;
      max-width: 610px;
      color: var(--muted);
    }

    .record-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: start;
      margin-bottom: 14px;
    }

    .record-head h2 {
      margin: 0;
      font-size: 1.45rem;
    }

    .record-head p {
      margin: 3px 0 0;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .tab {
      min-height: 40px;
      padding: 0 12px;
      border-radius: 6px;
      background: #e9edf3;
      color: var(--ink);
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .tab.active {
      background: #fff;
      border-color: var(--brand);
      color: var(--brand-strong);
      box-shadow: inset 0 -3px 0 var(--brand);
    }

    .panel {
      padding: 18px;
    }

    .panel + .panel {
      margin-top: 14px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title h3 {
      font-size: 1.05rem;
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 5px;
      grid-column: span 4;
      min-width: 0;
    }

    .field.wide {
      grid-column: span 8;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field.small {
      grid-column: span 3;
    }

    label {
      font-weight: 700;
      font-size: 0.83rem;
      color: #303b4a;
    }

    .hint {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .check-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .check {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
      min-height: 44px;
    }

    .check input {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .check span {
      font-weight: 650;
      font-size: 0.9rem;
    }

    .item-list {
      display: grid;
      gap: 10px;
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfd;
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .item-title {
      font-weight: 760;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      background: #f3f6f9;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-height: 82px;
    }

    .metric strong {
      display: block;
      font-size: 1.45rem;
      line-height: 1.1;
    }

    .metric span {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 760px;
      background: #fff;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      font-size: 0.9rem;
    }

    th {
      background: #eef2f5;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #3d4857;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: var(--ink);
      color: #fff;
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .file-input {
      display: none;
    }

    .code-box {
      width: 100%;
      overflow: auto;
      white-space: pre;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #17212f;
      color: #f8fafc;
      padding: 14px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    @media (max-width: 980px) {
      .topbar-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .building-list {
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      }

      .record-head {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      main,
      .sidebar {
        padding: 14px;
      }

      .field,
      .field.small,
      .field.wide {
        grid-column: 1 / -1;
      }

      .check-grid,
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .toolbar {
        width: 100%;
      }

      .btn {
        min-width: 0;
      }
    }

    @media print {
      .topbar,
      .sidebar,
      .tabs,
      .btn,
      .toast {
        display: none !important;
      }

      body {
        background: #fff;
      }

      .layout {
        display: block;
        max-width: none;
      }

      main {
        padding: 0;
      }

      .panel {
        border: 1px solid #999;
        box-shadow: none;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <h1>ADA Building Facility Inventory</h1>
          <p>Field workflow for transition plan building appendices</p>
        </div>
        <div class="toolbar" aria-label="Application actions">
          <button class="btn primary" id="newBuildingBtn" title="Create building">+ Building</button>
          <button class="btn" id="exportJsonBtn" title="Export project data">Export JSON</button>
          <button class="btn" id="exportCsvBtn" title="Export barrier schedule">Export CSV</button>
          <button class="btn" id="printBtn" title="Print selected building">Print</button>
          <button class="btn" id="importBtn" title="Import saved JSON">Import</button>
          <button class="btn" id="syncTabBtn" title="Configure cloud sync">Cloud Sync</button>
          <input class="file-input" id="importFile" type="file" accept="application/json">
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="search-row">
          <input class="input" id="searchInput" type="search" placeholder="Search buildings">
          <select class="select" id="filterStatus" aria-label="Filter status">
            <option value="">All</option>
            <option value="Draft">Draft</option>
            <option value="In progress">In progress</option>
            <option value="Ready for review">Ready</option>
            <option value="Complete">Complete</option>
          </select>
        </div>
        <div class="building-list" id="buildingList"></div>
      </aside>

      <main id="main"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const STORAGE_KEY = "ada-building-inventory-v1";
    const SUPABASE_CONFIG_KEY = "ada-building-supabase-config-v1";
    const SUPABASE_TABLE = "ada_buildings";
    const SUPABASE_URL = "https://mrtdlwtnjfzannitnkji.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ydGRsd3RuamZ6YW5uaXRua2ppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDYzODksImV4cCI6MjA5NjA4MjM4OX0.nChPmWjD54o8EH5PMAc9UkIOxBhj0KnL2anFShubSBE";
    const SUPABASE_SETUP_SQL = `create table if not exists public.ada_buildings (
  id text primary key,
  name text,
  address text,
  status text,
  created_by uuid,
  data jsonb not null,
  updated_at timestamptz not null default now()
);

create table if not exists public.authorized_users (
  email text primary key,
  active boolean not null default true,
  created_at timestamptz not null default now()
);

alter table public.ada_buildings enable row level security;
alter table public.authorized_users enable row level security;

alter table public.ada_buildings
add column if not exists created_by uuid,
add column if not exists updated_at timestamptz not null default now();

insert into public.authorized_users (email)
values
  ('achiki@ci.athens.oh.us'),
  ('mjennings@ci.athens.oh.us'),
  ('sam.tuten@sundaycreekhorizons.com'),
  ('kobrien@sundaycreekhorizons.com')
on conflict (email) do update set active = true;

drop policy if exists "Allow public read for field app" on public.ada_buildings;
drop policy if exists "Allow public insert for field app" on public.ada_buildings;
drop policy if exists "Allow public update for field app" on public.ada_buildings;
drop policy if exists "Allow public delete for field app" on public.ada_buildings;
drop policy if exists "Allow signed-in read for field app" on public.ada_buildings;
drop policy if exists "Allow signed-in insert for field app" on public.ada_buildings;
drop policy if exists "Allow signed-in update for field app" on public.ada_buildings;
drop policy if exists "Allow signed-in delete for field app" on public.ada_buildings;
drop policy if exists "Allow authorized users to read authorized list" on public.authorized_users;

create policy "Allow authorized users to read authorized list"
on public.authorized_users
for select
to authenticated
using (
  email = auth.jwt() ->> 'email'
  and active = true
);

create policy "Allow signed-in read for field app"
on public.ada_buildings
for select
to authenticated
using (
  exists (
    select 1
    from public.authorized_users
    where email = auth.jwt() ->> 'email'
      and active = true
  )
);

create policy "Allow signed-in insert for field app"
on public.ada_buildings
for insert
to authenticated
with check (
  exists (
    select 1
    from public.authorized_users
    where email = auth.jwt() ->> 'email'
      and active = true
  )
);

create policy "Allow signed-in update for field app"
on public.ada_buildings
for update
to authenticated
using (
  exists (
    select 1
    from public.authorized_users
    where email = auth.jwt() ->> 'email'
      and active = true
  )
)
with check (
  exists (
    select 1
    from public.authorized_users
    where email = auth.jwt() ->> 'email'
      and active = true
  )
);

create policy "Allow signed-in delete for field app"
on public.ada_buildings
for delete
to authenticated
using (
  exists (
    select 1
    from public.authorized_users
    where email = auth.jwt() ->> 'email'
      and active = true
  )
);`;

    const state = {
      buildings: [],
      selectedId: "",
      tab: "overview",
      search: "",
      filterStatus: "",
      supabase: {
        url: SUPABASE_URL,
        anonKey: SUPABASE_ANON_KEY,
        enabled: false,
        status: "Local only",
        lastSync: "",
        client: null,
        syncTimer: null,
        saving: false,
        session: null,
        user: null
      }
    };

    const tabs = [
      ["overview", "Overview"],
      ["parking", "Parking"],
      ["entryways", "Entryways"],
      ["publicSpaces", "Public Spaces"],
      ["restrooms", "Restrooms"],
      ["barriers", "Barrier Schedule"],
      ["exports", "Plan Output"],
      ["sync", "Cloud Sync"]
    ];

    const checklistLabels = {
      parking: [
        ["accessibleRoute", "Accessible route from parking to entrance"],
        ["firmStableSurface", "Firm, stable, slip-resistant surface"],
        ["signed", "Spaces signed with International Symbol of Accessibility"],
        ["accessAisleMarked", "Access aisles marked and connected"],
        ["slopeCompliant", "Running/cross slopes appear compliant"],
        ["vanSpacePresent", "Van-accessible space available where required"]
      ],
      entryways: [
        ["routeClear", "Clear accessible route to entry"],
        ["doorWidth", "Door clear width appears compliant"],
        ["threshold", "Threshold is low or beveled"],
        ["hardware", "Operable hardware does not require tight grasping"],
        ["maneuveringClearance", "Maneuvering clearance appears adequate"],
        ["signage", "Accessible entrance signage provided when needed"]
      ],
      publicSpaces: [
        ["routeWidth", "Interior route width appears compliant"],
        ["serviceCounters", "Service counters include accessible portion"],
        ["drinkingFountains", "Drinking fountains include accessible unit"],
        ["assemblySeating", "Assembly areas include accessible seating"],
        ["alarms", "Audible and visual alarms observed"],
        ["signage", "Room and directional signage provided"]
      ],
      restrooms: [
        ["route", "Accessible route to restroom"],
        ["door", "Door width, hardware, and maneuvering clearance"],
        ["turningSpace", "Turning space or T-turn available"],
        ["grabBars", "Grab bars installed correctly"],
        ["lavatory", "Lavatory knee clearance and controls"],
        ["accessories", "Dispensers, mirrors, and accessories within reach range"]
      ]
    };

    const categoryNames = {
      parking: "Accessible Parking",
      entryways: "Entryways",
      publicSpaces: "Public Spaces",
      restrooms: "Restrooms",
      exteriorRoute: "Exterior Route",
      programAccess: "Program Access",
      other: "Other"
    };

    function uid(prefix = "id") {
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    }

    function sampleBuilding() {
      return {
        id: uid("building"),
        name: "New Public Building",
        address: "",
        department: "",
        primaryUse: "",
        inspectionDate: new Date().toISOString().slice(0, 10),
        inspector: "",
        contact: "",
        status: "Draft",
        notes: "",
        sidewalkInventoryRef: "",
        parking: {
          totalSpaces: "",
          accessibleSpaces: "",
          vanSpaces: "",
          requiredAccessible: "",
          nearestEntrance: "",
          notes: "",
          checks: {}
        },
        entryways: [],
        publicSpaces: [],
        restrooms: [],
        barriers: []
      };
    }

    function blankBarrier(category = "parking") {
      return {
        id: uid("barrier"),
        category,
        location: "",
        finding: "",
        recommendation: "",
        priority: "2",
        estimatedCost: "",
        responsibleParty: "",
        targetYear: "",
        status: "Open",
        notes: ""
      };
    }

    function blankEntryway() {
      return {
        id: uid("entry"),
        name: "Main Entrance",
        publicEntrance: "Yes",
        accessibleEntrance: "Unknown",
        notes: "",
        checks: {}
      };
    }

    function blankPublicSpace() {
      return {
        id: uid("space"),
        name: "Public Lobby",
        floor: "",
        use: "",
        notes: "",
        checks: {}
      };
    }

    function blankRestroom() {
      return {
        id: uid("restroom"),
        name: "Public Restroom",
        floor: "",
        type: "Multi-user",
        accessible: "Unknown",
        notes: "",
        checks: {}
      };
    }

    function load() {
      const raw = localStorage.getItem(STORAGE_KEY);
      initSupabaseClient();
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        state.buildings = Array.isArray(data.buildings) ? data.buildings : [];
        state.selectedId = data.selectedId || state.buildings[0]?.id || "";
      } catch (error) {
        showToast("Saved data could not be loaded.");
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        buildings: state.buildings,
        selectedId: state.selectedId
      }));
      scheduleCloudSave();
    }

    function saveSupabaseConfig() {
      localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify({
        url: SUPABASE_URL,
        anonKey: SUPABASE_ANON_KEY
      }));
    }

    function initSupabaseClient() {
      const url = normalizeSupabaseUrl(state.supabase.url);
      const anonKey = normalizeSupabaseKey(state.supabase.anonKey);
      if (!url || !anonKey) {
        state.supabase.client = null;
        state.supabase.enabled = false;
        state.supabase.status = "Local only";
        return false;
      }
      if (!window.supabase?.createClient) {
        state.supabase.client = null;
        state.supabase.enabled = false;
        state.supabase.status = "Supabase library did not load";
        return false;
      }
      state.supabase.url = url;
      state.supabase.anonKey = anonKey;
      state.supabase.client = window.supabase.createClient(url, anonKey, {
        auth: {
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "pkce",
          persistSession: true
        }
      });
      state.supabase.enabled = true;
      state.supabase.status = `Cloud configured for ${url}`;
      handleAuthCallback();
      refreshAuthSession();
      setTimeout(refreshAuthSession, 800);
      state.supabase.client.auth.onAuthStateChange((_event, session) => {
        state.supabase.session = session;
        state.supabase.user = session?.user || null;
        renderSyncStatus();
        if (state.tab === "sync") renderMain();
      });
      return true;
    }

    function normalizeSupabaseUrl(value) {
      const trimmed = value.trim();
      if (!trimmed) return "";
      const match = trimmed.match(/https:\/\/[a-z0-9-]+\.supabase\.co/i);
      if (match) return match[0].replace(/\/+$/, "");
      try {
        const url = new URL(trimmed);
        return url.origin;
      } catch (error) {
        return trimmed.replace(/\/rest\/v1\/?$/i, "").replace(/\/+$/, "");
      }
    }

    function normalizeSupabaseKey(value) {
      return value.trim().replace(/^bearer\s+/i, "").replace(/^apikey:\s*/i, "").trim();
    }

    async function handleAuthCallback() {
      if (!state.supabase.client) return;
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      if (!code) return;
      state.supabase.status = "Completing sign-in...";
      renderSyncStatus();
      const { error } = await state.supabase.client.auth.exchangeCodeForSession(code);
      if (error) {
        state.supabase.status = `Sign-in callback failed: ${error.message}`;
        renderSyncStatus();
        return;
      }
      window.history.replaceState({}, document.title, window.location.pathname);
      await refreshAuthSession();
    }

    function scheduleCloudSave() {
      if (!state.supabase.enabled || !state.supabase.client || !state.supabase.user) return;
      clearTimeout(state.supabase.syncTimer);
      state.supabase.syncTimer = setTimeout(() => saveCloudAll(), 900);
    }

    async function refreshAuthSession() {
      if (!state.supabase.enabled || !state.supabase.client) return;
      const { data } = await state.supabase.client.auth.getSession();
      state.supabase.session = data?.session || null;
      state.supabase.user = state.supabase.session?.user || null;
      renderSyncStatus();
      if (state.tab === "sync") renderMain();
    }

    function requireSignedIn() {
      if (!state.supabase.enabled || !state.supabase.client) {
        showToast("Add Supabase settings first.");
        return false;
      }
      if (!state.supabase.user) {
        state.supabase.status = "Sign in before using cloud records";
        renderSyncStatus();
        showToast("Sign in with email and password first.");
        return false;
      }
      return true;
    }

    async function saveCloudAll() {
      if (!requireSignedIn() || state.supabase.saving) return;
      state.supabase.saving = true;
      state.supabase.status = "Saving to cloud...";
      renderSyncStatus();
      const rows = state.buildings.map((building) => ({
        id: building.id,
        name: building.name || "Untitled building",
        address: building.address || "",
        status: building.status || "Draft",
        created_by: state.supabase.user.id,
        data: building,
        updated_at: new Date().toISOString()
      }));
      try {
        if (rows.length) {
          const { error } = await state.supabase.client.from(SUPABASE_TABLE).upsert(rows, { onConflict: "id" });
          if (error) throw error;
        }
        state.supabase.lastSync = new Date().toLocaleString();
        state.supabase.status = rows.length ? "Cloud saved" : "Cloud connected";
      } catch (error) {
        state.supabase.status = cloudErrorMessage("Cloud save failed", error);
      } finally {
        state.supabase.saving = false;
        renderSyncStatus();
      }
    }

    async function testCloudConnection() {
      if (!requireSignedIn()) return;
      state.supabase.status = "Testing cloud connection...";
      renderSyncStatus();
      try {
        const { error } = await state.supabase.client
          .from(SUPABASE_TABLE)
          .select("id", { count: "exact", head: true });
        if (error) throw error;
        state.supabase.status = `Connection test passed for ${state.supabase.url}`;
        renderSyncStatus();
        showToast("Supabase connection works.");
      } catch (error) {
        state.supabase.status = cloudErrorMessage("Connection test failed", error);
        renderSyncStatus();
      }
    }

    function cloudErrorMessage(prefix, error) {
      const message = error?.message || "Unknown error";
      if (/invalid path/i.test(message)) {
        return `${prefix}: ${message}. Check that the URL field contains only https://your-project-ref.supabase.co and rerun Save Connection.`;
      }
      if (/relation .* does not exist/i.test(message) || /could not find the table/i.test(message)) {
        return `${prefix}: ${message}. Run the setup SQL in Supabase SQL Editor.`;
      }
      if (/row-level security/i.test(message) || /permission denied/i.test(message)) {
        return `${prefix}: this signed-in email is not authorized. Add the email to the authorized_users table in Supabase.`;
      }
      return `${prefix}: ${message}`;
    }

    function authFormValues() {
      const email = document.getElementById("signInEmail")?.value.trim();
      const password = document.getElementById("signInPassword")?.value;
      if (!email) {
        showToast("Enter an email address.");
        return null;
      }
      if (!password || password.length < 6) {
        showToast("Enter a password with at least 6 characters.");
        return null;
      }
      return { email, password };
    }

    async function signInWithPassword() {
      if (!state.supabase.enabled || !state.supabase.client) {
        showToast("Cloud connection is not available.");
        return;
      }
      const values = authFormValues();
      if (!values) return;
      state.supabase.status = "Signing in...";
      renderSyncStatus();
      const { data, error } = await state.supabase.client.auth.signInWithPassword(values);
      if (error) {
        state.supabase.status = `Sign-in failed: ${error.message}`;
      } else {
        state.supabase.session = data.session;
        state.supabase.user = data.user;
        state.supabase.status = "Signed in";
        showToast("Signed in.");
      }
      renderMain();
    }

    async function createPasswordAccount() {
      if (!state.supabase.enabled || !state.supabase.client) {
        showToast("Cloud connection is not available.");
        return;
      }
      const values = authFormValues();
      if (!values) return;
      state.supabase.status = "Creating account...";
      renderSyncStatus();
      const { data, error } = await state.supabase.client.auth.signUp({
        email: values.email,
        password: values.password,
        options: {
          emailRedirectTo: window.location.href.split("#")[0]
        }
      });
      if (error) {
        state.supabase.status = `Account creation failed: ${error.message}`;
      } else if (data.session) {
        state.supabase.session = data.session;
        state.supabase.user = data.user;
        state.supabase.status = "Account created and signed in";
        showToast("Account created.");
      } else {
        state.supabase.status = "Account created. Check your email to confirm it, then sign in.";
        showToast("Check your email to confirm the account.");
      }
      renderMain();
    }

    async function signOut() {
      if (!state.supabase.enabled || !state.supabase.client) return;
      const { error } = await state.supabase.client.auth.signOut();
      if (error) {
        state.supabase.status = `Sign-out failed: ${error.message}`;
      } else {
        state.supabase.session = null;
        state.supabase.user = null;
        state.supabase.status = "Signed out";
      }
      renderMain();
    }

    async function loadCloudAll() {
      if (!requireSignedIn()) return;
      state.supabase.status = "Loading from cloud...";
      renderSyncStatus();
      try {
        const { data, error } = await state.supabase.client
          .from(SUPABASE_TABLE)
          .select("id,data,updated_at")
          .order("updated_at", { ascending: false });
        if (error) throw error;
        state.buildings = (data || []).map((row) => ({ ...row.data, id: row.data?.id || row.id }));
        state.selectedId = state.buildings[0]?.id || "";
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          buildings: state.buildings,
          selectedId: state.selectedId
        }));
        state.supabase.lastSync = new Date().toLocaleString();
        state.supabase.status = `Loaded ${state.buildings.length} cloud records`;
        render();
        showToast("Cloud records loaded.");
      } catch (error) {
        state.supabase.status = cloudErrorMessage("Cloud load failed", error);
        renderSyncStatus();
      }
    }

    async function deleteCloudBuilding(id) {
      if (!state.supabase.enabled || !state.supabase.client || !state.supabase.user || !id) return;
      try {
        const { error } = await state.supabase.client.from(SUPABASE_TABLE).delete().eq("id", id);
        if (error) throw error;
        state.supabase.status = "Cloud record deleted";
        renderSyncStatus();
      } catch (error) {
        state.supabase.status = cloudErrorMessage("Cloud delete failed", error);
        renderSyncStatus();
      }
    }

    function selectedBuilding() {
      return state.buildings.find((building) => building.id === state.selectedId) || null;
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function updateBuilding(path, value) {
      const building = selectedBuilding();
      if (!building) return;
      const parts = path.split(".");
      let target = building;
      parts.slice(0, -1).forEach((part) => {
        target[part] = target[part] || {};
        target = target[part];
      });
      target[parts.at(-1)] = value;
      save();
    }

    function updateItem(collection, id, path, value) {
      const building = selectedBuilding();
      const item = building?.[collection]?.find((candidate) => candidate.id === id);
      if (!item) return;
      const parts = path.split(".");
      let target = item;
      parts.slice(0, -1).forEach((part) => {
        target[part] = target[part] || {};
        target = target[part];
      });
      target[parts.at(-1)] = value;
      save();
    }

    function addBuilding() {
      const building = sampleBuilding();
      state.buildings.unshift(building);
      state.selectedId = building.id;
      state.tab = "overview";
      save();
      render();
      document.getElementById("buildingName")?.focus();
    }

    function duplicateBuilding() {
      const building = selectedBuilding();
      if (!building) return;
      const copy = JSON.parse(JSON.stringify(building));
      copy.id = uid("building");
      copy.name = `${building.name || "Building"} Copy`;
      copy.entryways?.forEach((item) => item.id = uid("entry"));
      copy.publicSpaces?.forEach((item) => item.id = uid("space"));
      copy.restrooms?.forEach((item) => item.id = uid("restroom"));
      copy.barriers?.forEach((item) => item.id = uid("barrier"));
      state.buildings.unshift(copy);
      state.selectedId = copy.id;
      save();
      render();
    }

    function deleteBuilding() {
      const building = selectedBuilding();
      if (!building) return;
      const ok = confirm(`Delete ${building.name || "this building"} from this inventory?`);
      if (!ok) return;
      const deletedId = building.id;
      state.buildings = state.buildings.filter((candidate) => candidate.id !== building.id);
      state.selectedId = state.buildings[0]?.id || "";
      save();
      deleteCloudBuilding(deletedId);
      render();
      showToast("Building deleted.");
    }

    function addItem(collection, factory) {
      const building = selectedBuilding();
      if (!building) return;
      building[collection] = building[collection] || [];
      building[collection].push(factory());
      save();
      renderMain();
    }

    function deleteItem(collection, id) {
      const building = selectedBuilding();
      if (!building) return;
      building[collection] = building[collection].filter((item) => item.id !== id);
      save();
      renderMain();
    }

    function complianceForBuilding(building) {
      const totalFindings = building.barriers?.length || 0;
      const openFindings = building.barriers?.filter((barrier) => barrier.status !== "Complete").length || 0;
      if (!totalFindings) return ["No findings", "good"];
      if (openFindings === 0) return ["Findings closed", "good"];
      if (openFindings <= 2) return [`${openFindings} open`, "warn"];
      return [`${openFindings} open`, "bad"];
    }

    function filteredBuildings() {
      const term = state.search.trim().toLowerCase();
      return state.buildings.filter((building) => {
        const text = [building.name, building.address, building.department, building.primaryUse].join(" ").toLowerCase();
        return (!term || text.includes(term)) && (!state.filterStatus || building.status === state.filterStatus);
      });
    }

    function renderSidebar() {
      const list = document.getElementById("buildingList");
      const buildings = filteredBuildings();
      if (!buildings.length) {
        list.innerHTML = `<div class="empty-state" style="min-height:190px;padding:18px;"><div><h2>No buildings</h2><p>Add a building or adjust the search filter.</p></div></div>`;
        return;
      }
      list.innerHTML = buildings.map((building) => {
        const [label, tone] = complianceForBuilding(building);
        const active = building.id === state.selectedId ? " active" : "";
        return `
          <button class="building-card${active}" data-select="${building.id}">
            <span class="building-name">${escapeHtml(building.name || "Untitled building")}</span>
            <span class="meta-line">${escapeHtml(building.address || "No address entered")}</span>
            <span class="pill-row">
              <span class="pill">${escapeHtml(building.status || "Draft")}</span>
              <span class="pill ${tone}">${escapeHtml(label)}</span>
            </span>
          </button>
        `;
      }).join("");
    }

    function renderMain() {
      const main = document.getElementById("main");
      const building = selectedBuilding();
      if (state.tab === "sync") {
        main.innerHTML = renderSync();
        return;
      }
      if (!building) {
        main.innerHTML = `
          <section class="empty-state">
            <div>
              <h2>Start a building inventory</h2>
              <p>Create a record for each public building or related facility, then document parking, entrances, public areas, restrooms, and planned barrier removals.</p>
              <button class="btn primary" data-action="new-building">+ Create first building</button>
            </div>
          </section>
        `;
        return;
      }

      main.innerHTML = `
        <div class="record-head">
          <div>
            <h2>${escapeHtml(building.name || "Untitled building")}</h2>
            <p>${escapeHtml([building.address, building.department].filter(Boolean).join(" · ") || "Building facility inventory record")}</p>
          </div>
          <div class="toolbar">
            <button class="btn" data-action="duplicate-building">Duplicate</button>
            <button class="btn danger" data-action="delete-building">Delete</button>
          </div>
        </div>
        <nav class="tabs" aria-label="Building inventory sections">
          ${tabs.map(([id, label]) => `<button class="tab ${state.tab === id ? "active" : ""}" data-tab="${id}">${label}</button>`).join("")}
        </nav>
        ${renderTab(building)}
      `;
    }

    function renderTab(building) {
      if (state.tab === "overview") return renderOverview(building);
      if (state.tab === "parking") return renderParking(building);
      if (state.tab === "entryways") return renderEntryways(building);
      if (state.tab === "publicSpaces") return renderPublicSpaces(building);
      if (state.tab === "restrooms") return renderRestrooms(building);
      if (state.tab === "barriers") return renderBarriers(building);
      if (state.tab === "sync") return renderSync();
      return renderExports(building);
    }

    function renderOverview(building) {
      const open = building.barriers.filter((barrier) => barrier.status !== "Complete").length;
      const complete = building.barriers.filter((barrier) => barrier.status === "Complete").length;
      return `
        <section class="panel">
          <div class="section-title"><h3>Building Profile</h3></div>
          <div class="grid">
            ${field("Building name", "buildingName", building.name, "name", "text", "wide")}
            ${selectField("Status", building.status, "status", ["Draft", "In progress", "Ready for review", "Complete"], "small")}
            ${field("Inspection date", "inspectionDate", building.inspectionDate, "inspectionDate", "date", "small")}
            ${field("Address", "address", building.address, "address", "text", "wide")}
            ${field("Department or owner", "department", building.department, "department")}
            ${field("Primary public use", "primaryUse", building.primaryUse, "primaryUse")}
            ${field("Inspector", "inspector", building.inspector, "inspector")}
            ${field("Facility contact", "contact", building.contact, "contact")}
            ${field("Sidewalk inventory reference", "sidewalkInventoryRef", building.sidewalkInventoryRef, "sidewalkInventoryRef", "text", "wide", "Link, ID, or note for the separate sidewalk inventory app")}
            ${textareaField("General notes", building.notes, "notes")}
          </div>
        </section>
        <section class="panel">
          <div class="section-title"><h3>Readiness Snapshot</h3></div>
          <div class="summary-grid">
            <div class="metric"><strong>${building.entryways.length}</strong><span>Entryways</span></div>
            <div class="metric"><strong>${building.publicSpaces.length}</strong><span>Public spaces</span></div>
            <div class="metric"><strong>${building.restrooms.length}</strong><span>Restrooms</span></div>
            <div class="metric"><strong>${open}</strong><span>Open barriers</span></div>
          </div>
          <div style="margin-top:12px" class="summary-grid">
            <div class="metric"><strong>${building.parking.accessibleSpaces || 0}</strong><span>Accessible parking spaces</span></div>
            <div class="metric"><strong>${building.parking.vanSpaces || 0}</strong><span>Van spaces</span></div>
            <div class="metric"><strong>${complete}</strong><span>Completed barrier items</span></div>
            <div class="metric"><strong>${nextTargetYear(building) || "TBD"}</strong><span>Next target year</span></div>
          </div>
        </section>
      `;
    }

    function renderParking(building) {
      return `
        <section class="panel">
          <div class="section-title"><h3>Accessible Parking Spaces and Route</h3></div>
          <div class="grid">
            ${field("Total parking spaces", "totalSpaces", building.parking.totalSpaces, "parking.totalSpaces", "number", "small")}
            ${field("Required accessible spaces", "requiredAccessible", building.parking.requiredAccessible, "parking.requiredAccessible", "number", "small")}
            ${field("Accessible spaces observed", "accessibleSpaces", building.parking.accessibleSpaces, "parking.accessibleSpaces", "number", "small")}
            ${field("Van-accessible spaces", "vanSpaces", building.parking.vanSpaces, "parking.vanSpaces", "number", "small")}
            ${field("Nearest accessible entrance", "nearestEntrance", building.parking.nearestEntrance, "parking.nearestEntrance", "text", "wide")}
            ${textareaField("Parking notes and measurements", building.parking.notes, "parking.notes")}
          </div>
        </section>
        <section class="panel">
          <div class="section-title"><h3>Parking Compliance Checks</h3></div>
          ${renderChecks("parking", building.parking.checks, "parking.checks")}
        </section>
        ${quickBarrierPanel("parking")}
      `;
    }

    function renderEntryways(building) {
      return renderCollection("entryways", "Entryways", building.entryways, blankEntryway, (item, index) => `
        <div class="grid">
          ${itemField("entryways", item, "Entrance name", "name", item.name, "text", "wide")}
          ${itemSelect("entryways", item, "Public entrance", "publicEntrance", item.publicEntrance, ["Yes", "No", "Staff only"])}
          ${itemSelect("entryways", item, "Accessible entrance", "accessibleEntrance", item.accessibleEntrance, ["Yes", "No", "Unknown"])}
          ${itemTextarea("entryways", item, "Notes and measurements", "notes", item.notes)}
        </div>
        ${renderChecks("entryways", item.checks, "checks", item.id)}
      `, "entryways");
    }

    function renderPublicSpaces(building) {
      return renderCollection("publicSpaces", "Public Spaces", building.publicSpaces, blankPublicSpace, (item) => `
        <div class="grid">
          ${itemField("publicSpaces", item, "Space name", "name", item.name, "text", "wide")}
          ${itemField("publicSpaces", item, "Floor", "floor", item.floor)}
          ${itemField("publicSpaces", item, "Public use", "use", item.use)}
          ${itemTextarea("publicSpaces", item, "Notes and measurements", "notes", item.notes)}
        </div>
        ${renderChecks("publicSpaces", item.checks, "checks", item.id)}
      `, "publicSpaces");
    }

    function renderRestrooms(building) {
      return renderCollection("restrooms", "Restrooms", building.restrooms, blankRestroom, (item) => `
        <div class="grid">
          ${itemField("restrooms", item, "Restroom name", "name", item.name, "text", "wide")}
          ${itemField("restrooms", item, "Floor", "floor", item.floor)}
          ${itemSelect("restrooms", item, "Type", "type", item.type, ["Single-user", "Multi-user", "Family / companion", "Other"])}
          ${itemSelect("restrooms", item, "Accessible", "accessible", item.accessible, ["Yes", "No", "Unknown"])}
          ${itemTextarea("restrooms", item, "Notes and measurements", "notes", item.notes)}
        </div>
        ${renderChecks("restrooms", item.checks, "checks", item.id)}
      `, "restrooms");
    }

    function renderCollection(collection, title, items, factory, renderBody, barrierCategory) {
      return `
        <section class="panel">
          <div class="section-title">
            <h3>${title}</h3>
            <button class="btn primary" data-add-item="${collection}">+ Add</button>
          </div>
          <div class="item-list">
            ${items.length ? items.map((item, index) => `
              <article class="item">
                <div class="item-head">
                  <div class="item-title">${title.slice(0, -1)} ${index + 1}</div>
                  <button class="btn danger" data-delete-item="${collection}" data-id="${item.id}">Remove</button>
                </div>
                ${renderBody(item, index)}
              </article>
            `).join("") : `<p class="meta-line">No ${title.toLowerCase()} added yet.</p>`}
          </div>
        </section>
        ${quickBarrierPanel(barrierCategory)}
      `;
    }

    function renderBarriers(building) {
      return `
        <section class="panel">
          <div class="section-title">
            <h3>Barrier Removal Schedule</h3>
            <button class="btn primary" data-add-barrier="other">+ Finding</button>
          </div>
          <div class="item-list">
            ${building.barriers.length ? building.barriers.map((barrier, index) => renderBarrierItem(barrier, index)).join("") : `<p class="meta-line">No barriers recorded. Add findings from any section or create one here.</p>`}
          </div>
        </section>
      `;
    }

    function renderBarrierItem(barrier, index) {
      return `
        <article class="item">
          <div class="item-head">
            <div class="item-title">Finding ${index + 1}</div>
            <button class="btn danger" data-delete-item="barriers" data-id="${barrier.id}">Remove</button>
          </div>
          <div class="grid">
            ${itemSelect("barriers", barrier, "Category", "category", barrier.category, Object.keys(categoryNames), "small", categoryNames)}
            ${itemField("barriers", barrier, "Location", "location", barrier.location, "text", "wide")}
            ${itemTextarea("barriers", barrier, "Existing barrier or finding", "finding", barrier.finding)}
            ${itemTextarea("barriers", barrier, "Recommended action", "recommendation", barrier.recommendation)}
            ${itemSelect("barriers", barrier, "Priority", "priority", barrier.priority, ["1", "2", "3", "4"], "small")}
            ${itemField("barriers", barrier, "Estimated cost", "estimatedCost", barrier.estimatedCost, "text", "small")}
            ${itemField("barriers", barrier, "Responsible party", "responsibleParty", barrier.responsibleParty)}
            ${itemField("barriers", barrier, "Target year", "targetYear", barrier.targetYear, "number", "small")}
            ${itemSelect("barriers", barrier, "Status", "status", barrier.status, ["Open", "Planned", "In progress", "Complete"], "small")}
            ${itemTextarea("barriers", barrier, "Notes", "notes", barrier.notes)}
          </div>
        </article>
      `;
    }

    function renderExports(building) {
      const rows = building.barriers.map((barrier) => `
        <tr>
          <td>${escapeHtml(categoryNames[barrier.category] || barrier.category)}</td>
          <td>${escapeHtml(barrier.location)}</td>
          <td>${escapeHtml(barrier.finding)}</td>
          <td>${escapeHtml(barrier.recommendation)}</td>
          <td>${escapeHtml(barrier.priority)}</td>
          <td>${escapeHtml(barrier.estimatedCost)}</td>
          <td>${escapeHtml(barrier.targetYear)}</td>
          <td>${escapeHtml(barrier.status)}</td>
        </tr>
      `).join("");
      return `
        <section class="panel">
          <div class="section-title">
            <h3>Plan Narrative</h3>
            <button class="btn" data-copy-plan>Copy Narrative</button>
          </div>
          <textarea class="textarea" readonly style="min-height:250px">${escapeHtml(planNarrative(building))}</textarea>
        </section>
        <section class="panel">
          <div class="section-title"><h3>Improvement Schedule Preview</h3></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Category</th><th>Location</th><th>Finding</th><th>Recommended action</th><th>Priority</th><th>Cost</th><th>Year</th><th>Status</th>
                </tr>
              </thead>
              <tbody>${rows || `<tr><td colspan="8">No findings recorded.</td></tr>`}</tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderSync() {
      return `
        <section class="panel">
          <div class="section-title">
            <h3>Cloud Access</h3>
            <span class="pill ${state.supabase.enabled ? "good" : "warn"}" id="syncStatus">${escapeHtml(syncStatusText())}</span>
          </div>
          <p class="meta-line">The shared database connection is built into this app. Authorized users sign in with email and password before loading or saving cloud records.</p>
        </section>
        <section class="panel">
          <div class="section-title">
            <h3>Account</h3>
            <span class="pill ${state.supabase.user ? "good" : "warn"}">${escapeHtml(state.supabase.user ? state.supabase.user.email : "Not signed in")}</span>
          </div>
          <div class="grid">
            <div class="field">
              <label for="signInEmail">Email address</label>
              <input class="input" id="signInEmail" type="email" value="${escapeAttr(state.supabase.user?.email || "")}" placeholder="name@example.com">
              <span class="hint">Use one of the authorized email addresses.</span>
            </div>
            <div class="field">
              <label for="signInPassword">Password</label>
              <input class="input" id="signInPassword" type="password" autocomplete="current-password" placeholder="Password">
              <span class="hint">Minimum 6 characters.</span>
            </div>
            <div class="field full">
              <div class="toolbar" style="justify-content:flex-start">
                <button class="btn primary" data-action="sign-in-password">Sign In</button>
                <button class="btn" data-action="create-account">Create Account</button>
                <button class="btn" data-action="sign-out" ${state.supabase.user ? "" : "disabled"}>Sign Out</button>
              </div>
            </div>
          </div>
        </section>
        <section class="panel">
          <div class="section-title">
            <h3>Cloud Records</h3>
            <span class="pill ${state.supabase.user ? "good" : "warn"}">${state.supabase.user ? "Signed in" : "Sign in required"}</span>
          </div>
          <div class="toolbar" style="justify-content:flex-start">
            <button class="btn" data-action="test-cloud">Test Connection</button>
            <button class="btn" data-action="load-cloud">Load Cloud Records</button>
            <button class="btn" data-action="save-cloud">Save Local Records to Cloud</button>
          </div>
        </section>
        <section class="panel">
          <div class="section-title">
            <h3>Database Setup SQL</h3>
            <button class="btn" data-action="copy-sql">Copy SQL</button>
          </div>
          <p class="meta-line">Paste this into Supabase SQL Editor after publishing this update. It replaces the public pilot policies with signed-in-user policies.</p>
          <pre class="code-box">${escapeHtml(SUPABASE_SETUP_SQL)}</pre>
        </section>
        <section class="panel">
          <div class="section-title"><h3>Authorize More Users</h3></div>
          <pre class="code-box">${escapeHtml(`insert into public.authorized_users (email)
values ('inspector@example.com')
on conflict (email) do update set active = true;`)}</pre>
        </section>
      `;
    }

    function syncStatusText() {
      const parts = [state.supabase.status || "Local only"];
      if (state.supabase.user?.email) parts.push(`Signed in as ${state.supabase.user.email}`);
      if (state.supabase.lastSync) parts.push(`Last sync ${state.supabase.lastSync}`);
      return parts.join(" - ");
    }

    function renderSyncStatus() {
      const status = document.getElementById("syncStatus");
      if (status) status.textContent = syncStatusText();
    }

    function quickBarrierPanel(category) {
      return `
        <section class="panel">
          <div class="section-title">
            <h3>Add Finding for ${categoryNames[category]}</h3>
            <button class="btn primary" data-add-barrier="${category}">+ Add to Schedule</button>
          </div>
          <p class="meta-line">Use the barrier schedule for non-compliant items, program-access issues, or improvements that need cost, priority, and target-year tracking.</p>
        </section>
      `;
    }

    function field(label, id, value, path, type = "text", width = "", hint = "") {
      return `
        <div class="field ${width}">
          <label for="${id}">${label}</label>
          <input class="input" id="${id}" type="${type}" value="${escapeAttr(value)}" data-path="${path}">
          ${hint ? `<span class="hint">${hint}</span>` : ""}
        </div>
      `;
    }

    function textareaField(label, value, path) {
      return `
        <div class="field full">
          <label>${label}</label>
          <textarea class="textarea" data-path="${path}">${escapeHtml(value || "")}</textarea>
        </div>
      `;
    }

    function selectField(label, value, path, options, width = "") {
      return `
        <div class="field ${width}">
          <label>${label}</label>
          <select class="select" data-path="${path}">
            ${options.map((option) => `<option ${option === value ? "selected" : ""}>${escapeHtml(option)}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function itemField(collection, item, label, path, value, type = "text", width = "") {
      return `
        <div class="field ${width}">
          <label>${label}</label>
          <input class="input" type="${type}" value="${escapeAttr(value)}" data-collection="${collection}" data-id="${item.id}" data-item-path="${path}">
        </div>
      `;
    }

    function itemTextarea(collection, item, label, path, value) {
      return `
        <div class="field full">
          <label>${label}</label>
          <textarea class="textarea" data-collection="${collection}" data-id="${item.id}" data-item-path="${path}">${escapeHtml(value || "")}</textarea>
        </div>
      `;
    }

    function itemSelect(collection, item, label, path, value, options, width = "", labels = null) {
      return `
        <div class="field ${width}">
          <label>${label}</label>
          <select class="select" data-collection="${collection}" data-id="${item.id}" data-item-path="${path}">
            ${options.map((option) => `<option value="${escapeAttr(option)}" ${option === value ? "selected" : ""}>${escapeHtml(labels?.[option] || option)}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function renderChecks(category, checks = {}, path, itemId = "") {
      return `
        <div class="check-grid">
          ${checklistLabels[category].map(([key, label]) => `
            <label class="check">
              <input type="checkbox" ${checks[key] ? "checked" : ""} data-check="${path}.${key}" ${itemId ? `data-id="${itemId}" data-check-collection="${category}"` : ""}>
              <span>${label}</span>
            </label>
          `).join("")}
        </div>
      `;
    }

    function nextTargetYear(building) {
      const years = building.barriers
        .filter((barrier) => barrier.status !== "Complete")
        .map((barrier) => Number(barrier.targetYear))
        .filter(Boolean)
        .sort((a, b) => a - b);
      return years[0] || "";
    }

    function planNarrative(building) {
      const lines = [
        `Building Facility Inventory: ${building.name || "Untitled building"}`,
        `Address: ${building.address || "Not entered"}`,
        `Department/Owner: ${building.department || "Not entered"}`,
        `Inspection Date: ${building.inspectionDate || "Not entered"}`,
        `Inspector: ${building.inspector || "Not entered"}`,
        "",
        "Accessible Parking:",
        `Total spaces: ${building.parking.totalSpaces || "N/A"}; required accessible spaces: ${building.parking.requiredAccessible || "N/A"}; observed accessible spaces: ${building.parking.accessibleSpaces || "N/A"}; van-accessible spaces: ${building.parking.vanSpaces || "N/A"}.`,
        `Notes: ${building.parking.notes || "None recorded."}`,
        "",
        "Entryways:",
        ...(building.entryways.length ? building.entryways.map((item) => `${item.name || "Entrance"}: public entrance ${item.publicEntrance || "Unknown"}, accessible ${item.accessibleEntrance || "Unknown"}. ${item.notes || ""}`) : ["No entryways recorded."]),
        "",
        "Public Spaces:",
        ...(building.publicSpaces.length ? building.publicSpaces.map((item) => `${item.name || "Public space"}${item.floor ? `, floor ${item.floor}` : ""}: ${item.use || "Use not entered"}. ${item.notes || ""}`) : ["No public spaces recorded."]),
        "",
        "Restrooms:",
        ...(building.restrooms.length ? building.restrooms.map((item) => `${item.name || "Restroom"}${item.floor ? `, floor ${item.floor}` : ""}: ${item.type || "Type not entered"}, accessible ${item.accessible || "Unknown"}. ${item.notes || ""}`) : ["No restrooms recorded."]),
        "",
        "Barrier Removal Schedule:",
        ...(building.barriers.length ? building.barriers.map((barrier, index) => `${index + 1}. ${categoryNames[barrier.category] || barrier.category} - ${barrier.location || "Location TBD"}: ${barrier.finding || "Finding TBD"} Recommended action: ${barrier.recommendation || "Action TBD"} Priority ${barrier.priority || "TBD"}; cost ${barrier.estimatedCost || "TBD"}; target year ${barrier.targetYear || "TBD"}; status ${barrier.status || "Open"}.`) : ["No barriers recorded."])
      ];
      return lines.join("\n");
    }

    function exportJson() {
      download(`ada-building-inventory-${dateStamp()}.json`, JSON.stringify({
        exportedAt: new Date().toISOString(),
        buildings: state.buildings
      }, null, 2), "application/json");
    }

    function exportCsv() {
      const rows = [["Building", "Address", "Category", "Location", "Finding", "Recommended Action", "Priority", "Estimated Cost", "Responsible Party", "Target Year", "Status", "Notes"]];
      state.buildings.forEach((building) => {
        building.barriers.forEach((barrier) => {
          rows.push([
            building.name,
            building.address,
            categoryNames[barrier.category] || barrier.category,
            barrier.location,
            barrier.finding,
            barrier.recommendation,
            barrier.priority,
            barrier.estimatedCost,
            barrier.responsibleParty,
            barrier.targetYear,
            barrier.status,
            barrier.notes
          ]);
        });
      });
      const csv = rows.map((row) => row.map(csvCell).join(",")).join("\n");
      download(`ada-building-barrier-schedule-${dateStamp()}.csv`, csv, "text/csv");
    }

    function download(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
      showToast("Export created.");
    }

    function importJson(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const buildings = Array.isArray(data) ? data : data.buildings;
          if (!Array.isArray(buildings)) throw new Error("No buildings array");
          state.buildings = buildings;
          state.selectedId = buildings[0]?.id || "";
          save();
          render();
          showToast("Inventory imported.");
        } catch (error) {
          showToast("Import failed. Select a valid exported JSON file.");
        }
      };
      reader.readAsText(file);
    }

    function dateStamp() {
      return new Date().toISOString().slice(0, 10);
    }

    function csvCell(value = "") {
      const text = String(value ?? "");
      return `"${text.replaceAll("\"", "\"\"")}"`;
    }

    function escapeHtml(value = "") {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value = "") {
      return escapeHtml(value);
    }

    function render() {
      renderSidebar();
      renderMain();
    }

    document.addEventListener("input", (event) => {
      const target = event.target;
      if (target.id === "searchInput") {
        state.search = target.value;
        renderSidebar();
        return;
      }
      if (target.dataset.path) {
        updateBuilding(target.dataset.path, target.value);
        return;
      }
      if (target.dataset.itemPath) {
        updateItem(target.dataset.collection, target.dataset.id, target.dataset.itemPath, target.value);
      }
    });

    document.addEventListener("change", (event) => {
      const target = event.target;
      if (target.id === "filterStatus") {
        state.filterStatus = target.value;
        renderSidebar();
        return;
      }
      if (target.id === "importFile" && target.files[0]) {
        importJson(target.files[0]);
        target.value = "";
        return;
      }
      if (target.dataset.check) {
        if (target.dataset.checkCollection) {
          updateItem(target.dataset.checkCollection, target.dataset.id, target.dataset.check, target.checked);
        } else {
          updateBuilding(target.dataset.check, target.checked);
        }
        return;
      }
      if (target.dataset.path) {
        updateBuilding(target.dataset.path, target.value);
        renderSidebar();
        return;
      }
      if (target.dataset.itemPath) {
        updateItem(target.dataset.collection, target.dataset.id, target.dataset.itemPath, target.value);
      }
    });

    document.addEventListener("click", async (event) => {
      const target = event.target.closest("button");
      if (!target) return;
      if (target.id === "newBuildingBtn" || target.dataset.action === "new-building") addBuilding();
      if (target.id === "exportJsonBtn") exportJson();
      if (target.id === "exportCsvBtn") exportCsv();
      if (target.id === "printBtn") window.print();
      if (target.id === "importBtn") document.getElementById("importFile").click();
      if (target.id === "syncTabBtn") {
        state.tab = "sync";
        renderMain();
      }
      if (target.dataset.select) {
        state.selectedId = target.dataset.select;
        save();
        render();
      }
      if (target.dataset.tab) {
        state.tab = target.dataset.tab;
        renderMain();
      }
      if (target.dataset.action === "duplicate-building") duplicateBuilding();
      if (target.dataset.action === "delete-building") deleteBuilding();
      if (target.dataset.addItem === "entryways") addItem("entryways", blankEntryway);
      if (target.dataset.addItem === "publicSpaces") addItem("publicSpaces", blankPublicSpace);
      if (target.dataset.addItem === "restrooms") addItem("restrooms", blankRestroom);
      if (target.dataset.deleteItem) deleteItem(target.dataset.deleteItem, target.dataset.id);
      if (target.dataset.addBarrier) {
        const building = selectedBuilding();
        building.barriers.push(blankBarrier(target.dataset.addBarrier));
        state.tab = "barriers";
        save();
        render();
      }
      if (target.dataset.copyPlan !== undefined) {
        await navigator.clipboard.writeText(planNarrative(selectedBuilding()));
        showToast("Narrative copied.");
      }
      if (target.dataset.action === "load-cloud") loadCloudAll();
      if (target.dataset.action === "save-cloud") saveCloudAll();
      if (target.dataset.action === "test-cloud") testCloudConnection();
      if (target.dataset.action === "sign-in-password") signInWithPassword();
      if (target.dataset.action === "create-account") createPasswordAccount();
      if (target.dataset.action === "sign-out") signOut();
      if (target.dataset.action === "copy-sql") {
        await navigator.clipboard.writeText(SUPABASE_SETUP_SQL);
        showToast("Setup SQL copied.");
      }
    });

    load();
    render();
  </script>
</body>
</html>
